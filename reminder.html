<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quicky reminder</title>
  </head>
  <body>
    <main id="flood" class="flood" role="alertdialog" aria-labelledby="title" aria-describedby="note">
      <div class="stage">
        <div class="blob-wrap" aria-hidden="true">
          <svg class="blob" viewBox="0 0 40 36">
            <path d="M20 1C31 1 39 9 39 20c0 9-6 15-19 15S1 29 1 20C1 9 9 1 20 1z" fill="#2b2540" transform="translate(1.5 1.5)" />
            <path class="body" d="M20 1C31 1 39 9 39 20c0 9-6 15-19 15S1 29 1 20C1 9 9 1 20 1z" stroke="#2b2540" stroke-width="1.2" />
            <g class="eyes" fill="#fff"><rect x="12" y="13" width="4" height="7" rx="2" /><rect x="24" y="13" width="4" height="7" rx="2" /></g>
            <path class="mouth" d="M17 26q3 2.5 6 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <p class="kicker" id="time">Reminder</p>
        <h1 id="title">Task</h1>
        <p id="note" class="note"></p>
        <div class="actions">
          <button id="doing" class="act primary"><span>I'm on it</span><kbd>D</kbd></button>
          <button id="done" class="act"><span>Done</span><kbd>Enter</kbd></button>
          <button id="open" class="act ghost"><span>Open task</span><kbd>O</kbd></button>
        </div>
        <div class="snooze" role="group" aria-label="Snooze">
          <span>Later:</span>
          <button data-min="5">5 min <kbd>1</kbd></button>
          <button data-min="10" class="default">10 min <kbd>S</kbd></button>
          <button data-min="30">30 min <kbd>3</kbd></button>
          <button data-min="60">1 hour <kbd>4</kbd></button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/reminder.ts"></script>
  </body>
</html>
