name: Release

# Push a tag like v0.1.0 (or run it by hand) to build the Windows installer
# and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies can trust them (see README, Releasing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Quicky v__VERSION__
          releaseBody: |
            Download **Quicky_*_x64-setup.exe** below and run it. No admin rights needed.
            Windows may show "Windows protected your PC" because the installer isn't code-signed yet: click **More info**, then **Run anyway**. Already have Quicky? It updates itself (Settings, Updates).
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
