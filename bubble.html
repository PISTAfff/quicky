<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quicky bubble</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      button {
        position: absolute; left: calc(50% - 29px); top: calc(50% - 25px); width: 58px; height: 54px; padding: 0; border: 0; background: none;
        cursor: pointer; transform-origin: 50% 90%;
      }
      button:hover { transform: translateY(-3px) scale(1.07); }
      button:hover .bob { animation: wiggle 0.5s ease-in-out; }
      button.pressed { transform: scale(1.08, 0.88); transition-duration: 0.08s; }
      button:focus-visible { outline: 2.5px solid #6d4cff; outline-offset: 2px; border-radius: 50%; }
      button.appear { animation: appear 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      .bob { display: block; animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
      svg { display: block; overflow: visible; }
      .eyes-open { transform-box: fill-box; transform-origin: 50% 50%; }
      button.blink .eyes-open { animation: blink 0.22s ease-in-out; }
      .badge {
        position: absolute; right: -4px; top: -6px; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box;
        border-radius: 11px; background: #2b2540; color: #fff; border: 2px solid #f4f1ff;
        font: 800 12px/18px "Segoe UI", system-ui, sans-serif; text-align: center;
      }
      .badge[hidden] { display: none; }
      .badge.pop { animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.6); }
      @property --anger { syntax: "<number>"; inherits: true; initial-value: 0; }
      button { --anger: 0; transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.5), --anger 0.6s ease; }
      .squish { display: block; transform-origin: 50% 60%; }
      .bob { position: relative; }
      /* Winding up while the overlay for a big moment loads. */
      button.prep .squish { animation: prep 0.17s ease-in-out infinite alternate; }
      @keyframes prep { from { transform: scale(1.07, 0.92); } to { transform: scale(0.95, 1.06); } }
      /* Redder, frowning and squinting the harder it's tugged. */
      .body { fill: color-mix(in srgb, #ff3b3b calc(var(--anger) * 65%), var(--accent, #6d4cff)); transition: fill 0.3s; }
      .brows, .frown { opacity: var(--anger); }
      /* Happy by default: a little smile that fades as it gets annoyed. */
      .smile { opacity: calc(1 - var(--anger) * 1.6); }
      .clear .smile, .clear .frown { display: none; }
      .eyes-open { transform: scaleY(calc(1 - var(--anger) * 0.45)); }
      button.furious #face { animation: shake 0.09s linear infinite; }
      button.tugging { cursor: grabbing; }
      button.tugging { transform: none; }
      /* Mini Quicky inside an app: a smaller blob in a smaller window. */
      button { transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.5), scale 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.4), --anger 0.6s ease; }
      button.mini { scale: 0.66; transform-origin: 50% 50%; }
      button.mini .badge { scale: 1.25; }
      button.tugging .bob { animation: none; }
      @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-1px, 0.5px); } 75% { transform: translate(1px, -0.5px); } }
      .eyes-done { display: none; }
      .clear .eyes-open { display: none; }
      .clear .eyes-done { display: inline; }
      .clear .body { fill: #7fe0b9; }
      @keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.02, 0.98); } }
      @keyframes wiggle { 25% { transform: rotate(-7deg); } 60% { transform: rotate(5deg); } 100% { transform: rotate(0); } }
      @keyframes blink { 50% { transform: scaleY(0.1); } }
      @keyframes appear { from { transform: translateY(14px) scale(0.4); opacity: 0; } 70% { transform: translateY(-3px) scale(1.06); } }
      @keyframes pop { 40% { transform: scale(1.35); } }
      /* Something dragged over it: it opens wide; dropped, it gulps it down. */
      .gulp-mouth { display: none; }
      button.hungry .squish { transform: scale(1.14); transition: transform 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.5); }
      button.hungry .smile, button.hungry .frown { display: none; }
      button.hungry .gulp-mouth { display: inline; }
      button.gulp .squish { animation: gulp 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes gulp { 30% { transform: scale(1.22, 0.8); } 60% { transform: scale(0.9, 1.12); } }
      /* The pinned task is done: a happy hop and a ring of sparkles. */
      button.cheer .bob { animation: cheer 0.9s cubic-bezier(0.3, 0.8, 0.3, 1.2); }
      button.cheer .eyes-open, button.cheer .frown { display: none; }
      button.cheer .eyes-done { display: inline; }
      @keyframes cheer {
        15% { transform: translateY(2px) scale(1.15, 0.85); }
        45% { transform: translateY(-16px) scale(0.92, 1.1) rotate(-6deg); }
        70% { transform: translateY(0) scale(1.12, 0.9) rotate(3deg); }
        85% { transform: translateY(-3px) scale(0.98, 1.02); }
      }
      .spark { position: absolute; left: 50%; top: 45%; width: 7px; height: 7px; margin: -3.5px; border-radius: 2px; background: var(--c, #ffd166); opacity: 0; pointer-events: none; }
      button.cheer .spark { animation: spark 0.62s 0.25s ease-out both; }
      @keyframes spark {
        0% { opacity: 1; transform: rotate(var(--a)) translateX(10px) scale(0.6); }
        70% { opacity: 1; }
        100% { opacity: 0; transform: rotate(var(--a)) translateX(36px) scale(1) rotate(90deg); }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <button id="b" aria-label="Open Quicky">
      <span class="bob"><span class="squish">
        <svg width="58" height="52" viewBox="0 0 40 36" aria-hidden="true">
          <path id="shadow" d="M20 1C31 1 39 9 39 20c0 9-6 15-19 15S1 29 1 20C1 9 9 1 20 1z" fill="#2b2540" transform="translate(2 2)" />
          <path id="body" class="body" d="M20 1C31 1 39 9 39 20c0 9-6 15-19 15S1 29 1 20C1 9 9 1 20 1z" fill="#6d4cff" stroke="#2b2540" stroke-width="1.6" stroke-linejoin="round" />
          <g id="face">
          <g class="eyes-open" fill="#fff"><rect x="12" y="13" width="4" height="7" rx="2" /><rect x="24" y="13" width="4" height="7" rx="2" /></g>
          <path class="smile" d="M17.2 25.2q2.8 2.4 5.6 0" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />
          <path class="frown" d="M17.2 26.8q2.8-2.2 5.6 0" fill="none" stroke="#2b2540" stroke-width="1.8" stroke-linecap="round" />
          <g class="brows" fill="none" stroke="#2b2540" stroke-width="2.2" stroke-linecap="round"><path d="M10.5 10.5l6 2.4M29.5 10.5l-6 2.4" /></g>
          <g class="eyes-done" fill="none" stroke="#2b2540" stroke-width="2.6" stroke-linecap="round"><path d="M11 18q3-3 6 0M23 18q3-3 6 0" /></g>
          <ellipse class="gulp-mouth" cx="20" cy="26.5" rx="3.4" ry="3" fill="#2b2540" />
          </g>
        </svg>
      </span></span>
      <span class="badge" id="n" hidden></span>
      <i class="spark" style="--a: 0deg"></i><i class="spark" style="--a: 45deg; --c: #7fe0b9"></i>
      <i class="spark" style="--a: 90deg; --c: #ff8fab"></i><i class="spark" style="--a: 135deg; --c: #8ea4ff"></i>
      <i class="spark" style="--a: 180deg"></i><i class="spark" style="--a: 225deg; --c: #7fe0b9"></i>
      <i class="spark" style="--a: 270deg; --c: #ff8fab"></i><i class="spark" style="--a: 315deg; --c: #8ea4ff"></i>
    </button>
    <script type="module" src="/src/bubble.ts"></script>
  </body>
</html>
