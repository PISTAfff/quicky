<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quicky menu</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/menu.css" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      /* The window is sized to the menu (plus its shadow), so it sits at the top left. */
      .qmenu { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div class="qmenu" id="menu" role="menu" aria-label="Quicky" tabindex="-1"></div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
