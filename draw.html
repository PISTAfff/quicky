<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw on screen</title>
    <link rel="stylesheet" href="/src/tokens.css" />
    <style>
      /* A see-through window over every screen. The near-invisible fill keeps clicks on empty
         spots here instead of passing to the app underneath (fully clear pixels may let them through). */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; user-select: none; }
      body { background: rgba(0, 0, 0, 0.01); font: 700 13px/1.3 "Nunito", "Segoe UI", system-ui, sans-serif; color: var(--ink); cursor: crosshair; }
      body.through { background: transparent; cursor: default; }
      body.laser { cursor: none; }
      body.spot, body.eraser { cursor: none; }
      body.text { cursor: text; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      /* The spotlight: everything dimmed except a circle around the pointer. */
      #spot { position: fixed; inset: 0; pointer-events: none; display: none; }
      body.spot #spot { display: block; }

      /* Text labels are typed here, then drawn into the picture. */
      #text {
        position: fixed; display: none; min-width: 40px; padding: 0; margin: 0; border: 0; outline: 2px dashed color-mix(in srgb, var(--accent) 70%, transparent);
        outline-offset: 4px; border-radius: 4px; background: transparent; resize: none; overflow: hidden; white-space: pre; font-family: "Fredoka", "Nunito", system-ui, sans-serif;
        font-weight: 600; line-height: 1.2; caret-color: currentColor; user-select: text;
      }
      #text.on { display: block; }

      /* The toolbar: a Quicky sticker (ink outline, hard shadow), draggable by its grip. */
      .bar {
        position: fixed; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--card); color: var(--ink);
        border: 2.5px solid var(--edge); border-radius: 18px; box-shadow: 4px 4px 0 var(--edge); cursor: default; touch-action: none;
        animation: bar-in 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
      }
      @keyframes bar-in { from { transform: scale(0.6) translateY(-14px); opacity: 0; } }
      .sep { width: 2px; height: 26px; margin: 0 3px; border-radius: 2px; background: var(--line); flex-shrink: 0; }
      .bar button {
        width: 34px; height: 34px; border: 2px solid transparent; border-radius: 11px; background: transparent; color: inherit; display: grid; place-items: center;
        padding: 0; cursor: pointer; font: inherit; flex-shrink: 0; transition: transform 0.12s cubic-bezier(0.2, 0.9, 0.3, 1.5);
      }
      .bar button:hover { background: var(--soft); transform: translateY(-1px); }
      .bar button:active { transform: scale(0.92); }
      .bar button.on { background: var(--accent); color: var(--on-accent); border-color: var(--edge); }
      .bar button:disabled { opacity: 0.35; cursor: default; transform: none; background: transparent; }
      .bar button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 1px; }
      .bar svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .bar [hidden] { display: none; }
      .bar .grip { width: 18px; cursor: grab; color: var(--muted); }
      .bar .grip:hover { background: transparent; transform: none; }
      .bar .grip:active { cursor: grabbing; }
      .bar .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--edge); }
      .bar .swatch:hover { background: var(--c); }
      .bar .swatch.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); background: var(--c); border-color: var(--edge); }
      .bar .size i { display: block; border-radius: 50%; background: currentColor; }
      .bar .close:hover { background: var(--danger); color: #fff; }

      .toast {
        position: fixed; left: 0; top: 0; padding: 7px 12px; background: var(--solid); color: var(--on-solid); border: 2px solid var(--edge); border-radius: 12px;
        box-shadow: 3px 3px 0 var(--edge); white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(-6px); transition: opacity 0.18s, transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.4);
      }
      .toast.on { opacity: 1; transform: none; }
      .flash { position: fixed; inset: 0; background: #fff; pointer-events: none; animation: flash 0.35s ease-out forwards; }
      @keyframes flash { from { opacity: 0.55; } to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .bar, .flash { animation: none; }
        .flash { display: none; }
        .bar button, .toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="ink" aria-hidden="true"></canvas>
    <canvas id="live" aria-hidden="true"></canvas>
    <div id="spot" aria-hidden="true"></div>
    <textarea id="text" rows="1" spellcheck="false" aria-label="Text label"></textarea>
    <div id="bar" class="bar" role="toolbar" aria-label="Draw on screen"></div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="/src/draw.ts"></script>
  </body>
</html>
